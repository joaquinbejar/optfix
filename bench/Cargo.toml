[package]
name = "optfix-bench"
description = "LiteSVM harness that runs optfix-bench-program and produces docs/benchmarks.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# The implied-volatility profile test on SBF (`make iv-profile`, docs/PLAN-improvements.md
# milestone 20).
iv-profile = ["optfix/iv-profile"]

[dev-dependencies]
libm = { workspace = true }
litesvm = { workspace = true }
optfix = { workspace = true, features = ["bench-internals"] }
optfix-conformance = { path = "../conformance" }
solana-address = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-signer = { workspace = true }
solana-transaction = { workspace = true }

[lints]
workspace = true
