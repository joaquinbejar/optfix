[package]
name = "optfix"
description = "Fixed-point option pricing: no_std, allocation free, every rounding explicit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["options", "fixed-point", "black-scholes", "solana", "no-std"]
categories = ["finance", "mathematics", "no-std"]
# The library only: the tests read fixtures and references from the repository (`tools/`,
# about 10 MB of `tests/data/`) and run there.
include = ["/src", "/LICENSE"]

[features]
# Benchmark-only items (`bsm::baseline`); not public API.
bench-internals = []

[dependencies]
bytemuck = { workspace = true }

[dev-dependencies]
num-bigint = { workspace = true }
optionstratlib = { workspace = true }
proptest = { workspace = true }
rust_decimal = { workspace = true }

[lints]
workspace = true
