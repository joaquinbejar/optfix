# CI for optfix (docs/PLAN.md section 8, milestone 9): `make pre-push` and `make bench` on
# pinned toolchains, so the committed docs/benchmarks.md is reproduced exactly.
#
# `make pre-push` takes about 40 minutes on one runner, so its targets run as parallel jobs
# whose union is exactly `make pre-push`: `checks` (everything but `test` and
# `budget-control`), `test` in three shards (tools/test_shards.py, full case counts) and
# `budget-control`. `bench` regenerates the CU table and requires the committed one.
# `downstream` and `semver` (docs/PLAN-improvements.md, milestone 15) guard the callers: no CU
# growth in varswap, metalbook's pricer still passing, no unversioned breaking API change.
#
# Pins (bump each in its own PR, with the bench table regenerated and the budget re-agreed):
# - Agave CLI 4.4.0 release tarball, which bundles cargo-build-sbf 4.5.0;
# - platform-tools v1.57 (Rust 1.95.0 for SBF), installed from its verified archive;
# - host Rust 1.99.1 with rustfmt and clippy;
# - cargo-semver-checks 0.51.0 (installed with --locked);
# - the varswap and metalbook commits in ci/downstream.env;
# - nightly-2026-10-11 and cargo-fuzz 0.13.2 for the fuzz jobs (fuzz/Cargo.lock);
# - wasm-pack 0.15.1 and Node.js 24.22.0 (LTS) for the wasm job (wasm-bindgen from Cargo.lock).
# SHA-256 values are the digests GitHub publishes for the release assets.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_PIN: "1.99.1"
  AGAVE_VERSION: "v4.4.0"
  AGAVE_SHA256: "3363f4728fe786ac7036e342a20df928aa2e3e43f807fbdce67814840538c574"
  PLATFORM_TOOLS_VERSION: "v1.57"
  PLATFORM_TOOLS_SHA256: "b0f7af104adf726fff2a6a09ea2eb2f2d2965c92295f4d7388c08d140e0c2b00"
  CARGO_TERM_COLOR: never
  MAKE_PINS: RUST_TOOLCHAIN=1.99.1 CARGO_FLAGS=--locked
  SEMVER_CHECKS_VERSION: "0.51.0"
  FUZZ_NIGHTLY: nightly-2026-10-11
  CARGO_FUZZ_VERSION: "0.13.2"
  WASM_PACK_VERSION: "0.15.1"
  NODE_VERSION: "24.22.0"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchains
      - name: pre-push without test and budget-control
        run: |
          make $MAKE_PINS fmt-check lint lint-control tables-control tables-check \
            program-control program doc
      - name: the CI jobs cover make pre-push
        run: |
          want="fmt-check lint lint-control tables-control tables-check program-control program test budget-control doc"
          got=$(sed -n 's/^pre-push: //p' Makefile)
          [ "$got" = "$want" ] || { echo "pre-push is '$got'; update this workflow's jobs"; exit 1; }

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchains
      - run: make $MAKE_PINS program test-shard SHARDS=3 SHARD=${{ matrix.shard }}

  budget-control:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchains
      - run: make $MAKE_PINS program budget-control

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchains
      - run: make $MAKE_PINS bench
      - name: docs/benchmarks.md is the committed one
        run: git diff --exit-code docs/benchmarks.md

  # docs/PLAN-improvements.md, milestone 15: varswap's CU table measured with optfix at the merge
  # base and at the head, on this runner; any growth fails. metalbook's optfix pricer is off
  # chain, so it only has to build and pass its tests. Pins in ci/downstream.env.
  downstream:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/toolchains
      - name: optfix at the merge base
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT" = pull_request ]; then
            base=$(git merge-base "origin/$BASE_REF" HEAD)
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          else
            base=$(git rev-parse HEAD~1)
          fi
          git worktree add --detach ../optfix-base "$base"
          echo "optfix merge base $base, head $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: varswap with the merge base
        run: tools/downstream.sh varswap ../optfix-base ../ds-base ../base.md
      - name: varswap with the head
        run: tools/downstream.sh varswap . ../ds-head ../head.md
      - name: no varswap row costs more
        run: python3 tools/downstream_cu.py ../base.md ../head.md "$GITHUB_STEP_SUMMARY"
      - name: metalbook's optfix pricer with the head
        run: tools/downstream.sh metalbook . ../ds-metalbook

  # docs/PLAN-improvements.md, milestone 15: no breaking API change without a version bump.
  semver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Host Rust
        run: |
          rustup toolchain install "$RUST_PIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_PIN" >> "$GITHUB_ENV"
      - name: cargo-semver-checks
        run: cargo install cargo-semver-checks --version "$SEMVER_CHECKS_VERSION" --locked
      - run: cargo semver-checks check-release -p optfix

  # docs/PLAN-improvements.md, milestone 16: each fuzz target replays its committed corpus, then
  # searches for 60 seconds. .github/workflows/fuzz-nightly.yml runs each for 30 minutes.
  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned nightly and cargo-fuzz
        run: |
          rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal
          cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - run: make fuzz-smoke FUZZ_NIGHTLY="$FUZZ_NIGHTLY" FUZZ_SECONDS=60
      - name: Crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  # docs/PLAN-improvements.md, milestone 17: the wasm package built by wasm-pack, every
  # conformance generation replayed through it on Node.js, and the npm package as it would be
  # published (dry run; publishing happens at the release).
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Host Rust, wasm32 target and wasm-pack
        run: |
          rustup toolchain install "$RUST_PIN" --profile minimal --target wasm32-unknown-unknown
          echo "RUSTUP_TOOLCHAIN=$RUST_PIN" >> "$GITHUB_ENV"
          cargo +"$RUST_PIN" install wasm-pack --version "$WASM_PACK_VERSION" --locked
      - run: make wasm-test
      - name: npm package (dry run)
        working-directory: optfix-wasm/pkg
        run: npm publish --dry-run
