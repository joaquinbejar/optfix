[workspace]
members = ["optfix"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Joaquin Bejar <jb@taunais.com>"]
license = "MIT"
repository = "https://github.com/joaquinbejar/optfix"

[workspace.dependencies]
# Versions checked on crates.io (max_stable_version) on 2026-10-29.
bytemuck = { version = "1.25", default-features = false, features = ["derive"] }
proptest = "1.12"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
integer_division = "deny"
float_arithmetic = "deny"
panic_in_result_fn = "deny"
manual_assert = "deny"

[profile.release]
overflow-checks = true
