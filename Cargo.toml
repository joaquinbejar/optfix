[workspace]
members = ["optfix", "bench-program", "bench", "lint-control"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Joaquin Bejar <jb@taunais.com>"]
license = "MIT"
repository = "https://github.com/joaquinbejar/optfix"

[workspace.dependencies]
# Versions checked on crates.io (max_stable_version) on 2026-10-29.
bytemuck = { version = "1.25", default-features = false, features = ["derive"] }
proptest = "1.12"
# Test reference for exp and ln (arbitrary precision); dev-dependency only.
num-bigint = "0.5"
# The pricing oracle (PLAN 4.7): dev-dependency only, pricing feature only.
optionstratlib = { version = "0.23", default-features = false, features = ["pricing"] }
rust_decimal = "1.43"
# bench/ input draws: pure-Rust libm (0.2.16, checked 2026-10-31) gives the same f64 on every
# platform, so CI reproduces the committed CU table; dev-dependency only.
libm = "0.2"
optfix = { path = "optfix", version = "0.2" }
# Pinocchio 0.11 generation: decided exception to the latest-stable rule (docs/PLAN.md).
pinocchio = { version = "0.11", default-features = false, features = ["cpi"] }
# bench/ only: LiteSVM 0.18.1 (latest) pins these generations of the Solana client crates;
# approved exception to the latest-stable rule (docs/PLAN.md, Dependencies).
litesvm = "0.18"
solana-address = "2.7"
solana-instruction = "3.5"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-transaction = "4.3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
# Pinocchio's entrypoint macros test `target_os = "solana"`; `lint_control` is set only by
# `make lint-control`.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(lint_control)',
] }

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
integer_division = "deny"
float_arithmetic = "deny"
panic_in_result_fn = "deny"
manual_assert = "deny"
disallowed_macros = "deny"          # list in clippy.toml

[profile.release]
overflow-checks = true
codegen-units = 1
lto = "fat"
